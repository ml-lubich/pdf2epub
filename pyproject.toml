[project]
name = "pdf2epub"
version = "0.2.0"
description = "Convert PDF files to structured Markdown and EPUB with intelligent layout detection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
authors = [
  { name = "ml-lubich" },
]
keywords = ["pdf", "epub", "markdown", "ocr", "marker"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]
dependencies = [
  "marker-pdf==1.10.2",
  "transformers==4.57.6",
  "markdown==3.10.2",
  "latex2mathml==3.81.0",
  "regex>=2024.0.0",
  "Pillow>=10.0.0,<11.0.0",
]

[project.urls]
Homepage = "https://github.com/ml-lubich/pdf2epub"
Repository = "https://github.com/ml-lubich/pdf2epub"
Issues = "https://github.com/ml-lubich/pdf2epub/issues"

[project.scripts]
pdf2epub = "pdf2epub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F"]
